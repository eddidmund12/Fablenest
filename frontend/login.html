<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login </title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.cdnfonts.com/css/aeonika" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap"rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                fontFamily: {
                    clash: ["Clash Display", 'sans-serif'],
                    orbitron: ['Orbitron', 'sans-serif'],
                    aeonik: ['Aeonik', 'sans-serif'],
                }
                }
            }
        }
    </script>
</head>
<body class="flex ">
    <div class="hidden relative md:flex lg:flex min-h-screen w-[80%] justify-center md:w-[60%] overflow-hidden lg:h-[105vh] transition-all duration-200 ease-in-out" >
        <img src="img/Aesthetic (1).webp" class="h-full w-full object-cover  "  alt="">
        <div class="absolute inset-0 bg-black/60 flex flex-col  justify-center items-center leading-none text-gray-100 px-5">
            <span class="text-[7rem] ">Join</span>
            <span class="text-[7rem] " id="counter"></span>
            <span class="text-[3rem] text-center">Readers Exploring Tech & Ideas</span>
        </div>
    </div>
    <div class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 px-6 py-20 min-h-screen w-full md:pt-32 lg:py-5 lg:px-6 lg:w-full lg:flex lg:justify-center lg:items-center transition-all duration-200 ease-in-out">
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-700 p-6  shadow-2xl rounded-2xl lg:px-6 lg:w-auto lg:flex lg:justify-center ">
            <div class="flex flex-col gap-6 lg:w-[400px] lg:gap-4">
                <h2 class="text-center text-white text-[17px] md:text-[25px]">Welcome Back</h2>
                <div class="flex justify-center">
                    <button class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:scale-[1.02] transition transform font-semibold p-1 rounded-md flex gap-4 items-center justify-center sign-btn md:py-2 lg:w-[300px]">
                        <img src="img/google icon.webp" alt="" class="h-6 w-6 md:h-8 md:w-8">
                        <h5 class="text-white p-none m-none text-[16px] md:text-[20px] ">Log in with Google</h5>
                    </button>
                </div>
                <div class="flex items-center gap-3 text-slate-400 text-sm">
                    <div class="flex-1 h-px bg-slate-700"></div>
                        <span>Or log in with email</span>
                        <div class="flex-1 h-px bg-slate-700"></div>
                    </div>
                <form class="input-field flex flex-col gap-2 md:gap-3" id="signup-form" novalidate>
                    <div class="flex flex-col">
                        <input type="email" id="email" placeholder="Email Address" class="focus:border-purple-500 focus:ring-2 focus:ring-purple-500/40 outline-none transition">
                        <p class="error text-red-500 text-sm hidden"></p>
                    </div>
                    <div class="flex flex-col relative">
                        <input type="password" id="password" placeholder="Password" class="focus:border-purple-500 focus:ring-2 focus:ring-purple-500/40 outline-none transition pr-12">
                        <img src="img/eye-blind.webp" class="toggle-password absolute h-10 w-10 top-[10%] right-0" alt="">
                        <p class="error text-red-500 text-sm hidden"></p>

                    </div>
                    <div class="flex justify-right items-right">
                        <a href="forgot-password.html" class="underline text-[#ab7ff7]">Forgot password?</a>
                    </div>
                    <div class="flex justify-center">
                        <button type="submit" class="bg-gradient-to-l w-[200px] from-purple-600 to-indigo-600 hover:scale-[1.02] transition transform font-semibold py-2 text-[18px] text-[#fefefe] rounded-lg md:text-[24px] lg:w-[300px]" id="sign-up">Log in</button>
                    </div>
                </form>
                
                <div class="bg-[#383b4b] h-[1px] w-full"></div>
                <div class="flex gap-1 justify-center">
                    
                    <h5 class="text-[13px] text-[#e6e8f6] md:text-[17px]">Don't have an account? </h5>
                    <a href="signup.html" class="underline text-[#ab7ff7] text-[13px] md:text-[17px]">Sign up</a>
                </div>
            </div>
        </div>
    </div>
    <script src="dist/login.js" ></script>
</body>
</html>
